name: Publish GitHub Pages

on:
  push:
    branches: ['claude/epic-hypatia-ctxoo9']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build:web
      - name: Verify browser bundle under the repository path
        run: npm run smoke
        env:
          CHROMIUM_PATH: /opt/google/chrome/chrome
          SMOKE_ROOT: dist/web
          SMOKE_BASE_PATH: /fly/
      - name: Verify mobile controls and responsive bundle
        run: npm run smoke:mobile
        env:
          CHROMIUM_PATH: /opt/google/chrome/chrome
          SMOKE_ROOT: dist/web
          SMOKE_BASE_PATH: /fly/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
